name: Merge testnet and mainnet into staging

# Keeps one pull request open for each of testnet and mainnet while it has
# commits that staging lacks. Promotion in the other direction stays manual.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: merge-into-staging
  cancel-in-progress: false

env:
  TARGET: staging
  SOURCES: testnet mainnet

jobs:
  # Runs without the merge-bot environment, so an hour with nothing to merge
  # never loads the app key.
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      sources: ${{ steps.check.outputs.sources }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pending=()
          for src in $SOURCES; do
            head="ci/merge-$src-into-$TARGET"
            ahead=$(gh api "repos/$REPO/compare/$TARGET...$src" --jq .ahead_by)
            if [ "$ahead" = 0 ]; then
              echo "$src: nothing to merge"
              continue
            fi
            open=$(gh pr list -R "$REPO" --head "$head" --base "$TARGET" --state open --json number --jq length)
            if [ "$open" != 0 ] && [ "$(gh api "repos/$REPO/compare/$src...$head" --jq .behind_by)" = 0 ]; then
              echo "$src: the open pull request already carries $src"
              continue
            fi
            echo "$src: $ahead commit(s) to merge"
            pending+=("$src")
          done
          echo "sources=$(jq -cn '$ARGS.positional' --args "${pending[@]}")" >> "$GITHUB_OUTPUT"

  merge:
    needs: check
    if: needs.check.outputs.sources != '[]'
    name: Merge ${{ matrix.source }} into staging
    runs-on: ubuntu-latest
    # The environment admits only runs on staging, so a workflow on any other
    # branch cannot read the app key.
    environment: merge-bot
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.check.outputs.sources) }}
    env:
      SOURCE: ${{ matrix.source }}
      HEAD_BRANCH: ci/merge-${{ matrix.source }}-into-staging
      LABEL: merge-conflict
      REPO: ${{ github.repository }}
    steps:
      # Pushes and pull requests made with github.token start no workflows, so
      # CI would never run on the pull request. `workflows: write` lets the
      # merge commit carry changes to .github/workflows.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Merge and open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)+$bot@users.noreply.github.com"

          src=$(git rev-parse "origin/$SOURCE")
          pr=$(gh pr list --head "$HEAD_BRANCH" --base "$TARGET" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            # Builds on the branch as people left it, so a pushed conflict
            # resolution is never overwritten.
            git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          else
            git checkout -B "$HEAD_BRANCH" "origin/$TARGET"
          fi
          if git merge-base --is-ancestor "$src" HEAD; then
            echo "$HEAD_BRANCH already contains $SOURCE"
            exit 0
          fi
          new_commits=$(git rev-list "HEAD..$src")

          # A modify/delete, rename or binary conflict leaves no markers, and
          # `git add -A` then keeps one side silently, so the unmerged paths are
          # recorded before staging.
          subject="Merge $SOURCE into $TARGET"
          conflicts=()
          if ! git merge --no-ff --no-edit -m "$subject" "$src"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" = 0 ]; then
              echo "::error::git merge failed without reporting a conflict" >&2
              exit 1
            fi
            git add -A
            git commit --no-verify -F - <<EOF
          $subject

          Committed with these paths unresolved:
          $(printf '    %s\n' "${conflicts[@]}")
          EOF
          fi

          # Gated before the push: once the branch carries the source, the next
          # run has nothing to redo.
          if [ "${#conflicts[@]}" != 0 ]; then
            gh label create "$LABEL" --color B60205 --description "Committed with unresolved merge conflicts" 2>/dev/null || true
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --add-label "$LABEL"
              gh pr ready "$pr" --undo
            fi
          fi

          if [ -n "$pr" ]; then
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          else
            # With no open pull request, a branch left by a closed one is replaced.
            git push --force origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi

          count=$(wc -l <<< "$new_commits")
          summary="Merges $count new commit(s) from \`$SOURCE\` at ${src:0:9}."
          if [ "${#conflicts[@]}" != 0 ]; then
            summary="$summary

          > [!WARNING]
          > The merge has conflicts. They are committed as git left them, and this pull request is a draft until they are resolved. A delete or binary conflict has no markers, so check every file listed:
          >
          $(printf "> - \`%s\`\n" "${conflicts[@]}")
          >
          > To resolve, check out \`$HEAD_BRANCH\`, fix these files, and push the fix as its own commit. Then remove the \`$LABEL\` label and mark the pull request ready for review."
          fi

          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "$summary"
          else
            body="Merges \`$SOURCE\` into \`$TARGET\`. The [merge-into-staging](https://github.com/$REPO/blob/$TARGET/.github/workflows/merge-into-staging.yml) workflow opened this pull request.

          $summary

          Changes on \`$SOURCE\`: https://github.com/$REPO/compare/$TARGET...$SOURCE

          Review is requested from the authors and reviewers of the pull requests these commits came from. When \`$SOURCE\` moves, the workflow merges it into this branch again and never force-pushes, so a resolution pushed here is kept."
            args=(--head "$HEAD_BRANCH" --base "$TARGET" --title "$subject" --body "$body")
            if [ "${#conflicts[@]}" != 0 ]; then
              args+=(--draft --label "$LABEL")
            fi
            pr=$(gh pr create "${args[@]}" | sed 's|.*/||')
          fi

          # Authors and reviewers of the merged pull requests behind the new
          # commits, or the commit author where a commit has no pull request.
          # The open pull request carrying a commit, this one included, is not
          # one of them. Lookups are best effort, because the branch is already
          # pushed and the next run has nothing to redo. On failure `gh api`
          # prints the error body to stdout, so `lookup` drops it.
          lookup() {
            local out
            if out=$(gh api "$@"); then
              printf '%s\n' "$out"
            else
              echo "::warning::lookup failed: gh api $*" >&2
            fi
          }
          prs=()
          reviewers=()
          for sha in $new_commits; do
            mapfile -t merged < <(lookup "repos/$REPO/commits/$sha/pulls" --jq '.[] | select(.merged_at != null) | .number')
            if [ "${#merged[@]}" = 0 ]; then
              reviewers+=("$(lookup "repos/$REPO/commits/$sha" --jq '.author.login // empty')")
            fi
            prs+=("${merged[@]}")
          done
          for n in $(printf '%s\n' "${prs[@]}" | sort -u); do
            reviewers+=("$(lookup "repos/$REPO/pulls/$n" --jq .user.login)")
            mapfile -t -O "${#reviewers[@]}" reviewers < <(lookup --paginate "repos/$REPO/pulls/$n/reviews" --jq '.[].user.login')
          done
          for login in $(printf '%s\n' "${reviewers[@]}" | grep -v -e '^$' -e '\[bot\]$' | sort -u); do
            gh api "repos/$REPO/pulls/$pr/requested_reviewers" -f "reviewers[]=$login" --silent \
              || echo "::warning::could not request review from $login"
          done
